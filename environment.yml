name: paleoamp
channels:
  - bioconda
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.11

  # Bioinformatics tools (installed via conda for reliable PATH integration)
  - megahit>=1.2.9        # metagenomic assembly (paleoamp assemble run)
  - prodigal>=2.6.3       # ORF prediction (paleoamp predict orfs)
  - mmseqs2>=14.7564      # novelty screening + cluster-based train/test split

  # Core Python packages
  - biopython>=1.83
  - click>=8.0
  - numpy>=1.24
  - pandas>=2.0
  - requests>=2.28
  - rich>=13.0
  - pyyaml>=6.0

  # ML stack
  - pytorch>=2.0          # MLP classifier training and inference
  - cpuonly               # remove this line if you have a CUDA GPU

  # pip-only packages
  - pip
  - pip:
    - pysradb>=2.0                         # SRA search and download
    - transformers>=4.35                   # ESM-2 embeddings (Hugging Face)
    - paleoamp @ file:.                    # the PaleoAMP package itself
